name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: alexfayers/llm-prompts/.github/actions/setup-just@main
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: just lint-check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: alexfayers/llm-prompts/.github/actions/setup-just@main
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: just type-check

  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'blocked') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: alexfayers/llm-prompts/.github/actions/setup-just@main
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: just test -vv --cov=.
      - uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          ANNOTATE_MISSING_LINES: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: alexfayers/llm-prompts/.github/actions/setup-just@main
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Measure base and head
        id: benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth 1 origin "$BASE_SHA"
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          flags=""
          if grep -qx 'size-increase-accepted' <<< "$labels"; then flags="$flags --allow-growth"; fi
          if grep -qx 'ranking-drop-accepted' <<< "$labels"; then flags="$flags --allow-ranking-drop"; fi
          status=0
          just bench-diff "$BASE_SHA" $flags > benchmark.md || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Save the benchmark report
        if: steps.benchmark.outputs.status != '2'
        run: |
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.event.pull_request.number }}" > pr-number
      - uses: actions/upload-artifact@v7
        if: steps.benchmark.outputs.status != '2'
        with:
          name: benchmark-report
          path: |
            benchmark.md
            pr-number
      - name: Fail on a benchmark regression
        if: steps.benchmark.outputs.status != '0'
        run: exit 1

  benchmark-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: benchmark-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: alexfayers/llm-prompts/.github/actions/setup-just@main
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: just baseline
      - run: uv run python -m tests.eval.badge_endpoints tests/eval/baseline.json "$RUNNER_TEMP/badge"
      - name: Publish badge endpoints
        working-directory: ${{ runner.temp }}/badge
        run: |
          git init --initial-branch benchmark-badge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add size.json ranking.json
          git commit --message "chore: update benchmark badges for $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" HEAD:benchmark-badge

  pr-template-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - run: node --test .github/scripts/*.test.js
      - uses: alexfayers/llm-prompts/.github/actions/pr-template@main
