rules:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/mcp_memory/prompts/*/rules/**'
          - 'src/mcp_memory/prompts/*/skills/**'

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.py'
          - 'pyproject.toml'
          - 'justfile'
          - '.github/**'

tests:
  - changed-files:
      - any-glob-to-any-file: 'tests/**'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'
