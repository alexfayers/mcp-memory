[project]
name = "mcp-memory"
version = "0.1.0"
description = "SQLite-backed persistent memory MCP server with FTS5 search and project scoping"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Alex Fayers" }]
dependencies = ["mcp>=1.27,<2", "httpx", "better-profanity"]

[project.scripts]
mcp-memory = "mcp_memory.cli:main"
memory-agent = "mcp_memory.agent:main"

[project.entry-points."cline_hooks"]
memory = "mcp_memory.hooks.plugin:MemoryPlugin"

[project.entry-points."llm_prompts"]
memory = "mcp_memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 120
extend = ".venv/.fayers-configs/ruff/pyproject.toml"

[tool.ruff.lint]
extend-ignore = [
    "D",                                         # pydocstyle - we use Google docstrings selectively
    "ANN",                                       # flake8-annotations - we use type hints but not on every function
    "missing-trailing-comma",                    # trailing comma - conflicts with ruff format
    "single-line-implicit-string-concatenation", # single line implicit string concat - conflicts with ruff format
    "assert",                                    # assert - used in tests
    "magic-value-comparison",                    # magic value comparison - too noisy
    "too-many-arguments",                        # too many arguments - some functions need them
    "EM",                                        # exception message style - f-strings in exceptions are fine
    "raise-vanilla-args",                        # long exception messages - descriptive errors are good
    "try-consider-else",                         # return in try - acceptable for simple try/except patterns
    "raise-within-try",                          # raise in try - acceptable for validation
    "blind-except",                              # blind exception - intentional in MCP tool handlers
    "invalid-argument-name",                     # camelCase args - required by MCP protocol
    "builtin-argument-shadowing",                # shadowing builtin - 'type' param required by MCP protocol
    "typing-only-standard-library-import",       # type-checking import - sqlite3 used at runtime
    "hardcoded-sql-expression",                  # SQL injection - placeholders are safe, not user input
    "manual-list-comprehension",                 # list.extend - readability preferred
    "collapsible-if",                            # nested if - readability preferred
    "if-else-block-instead-of-if-exp",           # ternary operator - if/else preferred for clarity
    "FBT",                                       # boolean args - acceptable for keyword-only params like compact=True
    "docstring-missing-returns",
    "docstring-missing-exception",
    "repeated-append",
    "unused-async",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "unused-function-argument",
    "unused-method-argument",
    "too-many-positional-arguments",
    "private-member-access",
    "hardcoded-temp-file",
    "async-function-with-timeout",
    "typing-only-third-party-import",
    "pytest-fixture-autouse",
    "too-many-locals",
    "non-empty-init-module",
]
"tests/eval/regen_eval_baseline.py" = ["print"]
"src/mcp_memory/migrations/schema.py" = ["line-too-long"]
"src/mcp_memory/visualise.py" = [
    "line-too-long",
    "unused-function-argument",
    "typing-only-third-party-import",
    "complex-structure",
    "too-many-statements",
]
"src/mcp_memory/cli.py" = [
    "print",
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
    "import-outside-top-level",
]
"src/mcp_memory/agent.py" = [
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
    "async-function-with-timeout",
]

[tool.ruff.format]
# Frozen migration history - reformatting it breaks the byte-identity check on migrations.
exclude = ["src/mcp_memory/migrations/schema.py"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "better_profanity"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
fayers-configs = { git = "https://github.com/alexfayers/fayers-configs" }
cline-hooks = { path = "../cline-hooks", editable = true }

[dependency-groups]
dev = ["ruff>=0.11", "mypy>=1.15", "pytest>=8", "fayers-configs", "cline-hooks"]
