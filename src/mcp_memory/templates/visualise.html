<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp-memory graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; }
#controls { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; }
select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
select:hover, button:hover { border-color: #58a6ff; }
#status { position: fixed; top: 16px; right: 12px; font-size: 11px; color: #484f58; z-index: 10; }
#panel { position: fixed; right: 0; top: 0; width: 340px; height: 100%; background: #161b22; border-left: 1px solid #30363d; padding: 16px; overflow-y: auto; transform: translateX(100%); transition: transform 0.2s; z-index: 10; }
#panel.open { transform: translateX(0); }
#panel h2 { font-size: 15px; margin-bottom: 4px; color: #58a6ff; word-break: break-all; }
#panel h3 { font-size: 12px; color: #484f58; margin-bottom: 12px; }
#panel .status-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #30363d; margin-bottom: 12px; }
#panel .obs { font-size: 12px; line-height: 1.6; color: #8b949e; padding: 4px 0; border-bottom: 1px solid #21262d; }
#panel-close { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #484f58; cursor: pointer; font-size: 18px; }
svg { width: 100vw; height: 100vh; }
.link { stroke-opacity: 0.4; }
.link-label { font-size: 9px; fill: #484f58; pointer-events: none; }
.node circle { stroke-width: 1.5; cursor: pointer; }
.node text { font-size: 10px; fill: #8b949e; pointer-events: none; }
.node.selected circle { stroke: #f0f6fc !important; stroke-width: 3; }
.node.orphan circle { stroke: #f85149; stroke-dasharray: 4 2; }
#legend { position: fixed; bottom: 12px; left: 12px; z-index: 10; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; font-size: 11px; }
#legend h4 { font-size: 11px; color: #484f58; margin-bottom: 6px; }
#legend .row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#legend .section { margin-top: 8px; }
@keyframes glowpulse {
  0%   { filter: drop-shadow(0 0 1px var(--glow)); }
  30%  { filter: drop-shadow(0 0 11px var(--glow)) drop-shadow(0 0 5px var(--glow)); }
  100% { filter: drop-shadow(0 0 0 transparent); }
}
@keyframes feedin { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
.node.activity circle { animation: glowpulse 1.5s ease-out; }
.ripple { fill: none; pointer-events: none; }
#activity { position: fixed; top: 54px; left: 12px; z-index: 10; width: 320px; max-width: 40vw;
  background: rgba(22,27,34,0.82); border: 1px solid #30363d; border-radius: 6px;
  backdrop-filter: blur(4px); overflow: hidden; font-size: 11px; }
#activity-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid #21262d; }
#activity-head .pulse { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 6px #3fb950; flex-shrink: 0; animation: glowpulse 1.6s ease-in-out infinite; --glow: #3fb950; }
#activity-head .tally { display: flex; gap: 9px; margin-left: auto; }
#activity-head .tally span { display: flex; align-items: center; gap: 3px; color: #8b949e; font-variant-numeric: tabular-nums; }
#activity-head .tally i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
#feed { max-height: 34vh; overflow-y: auto; }
#feed:empty::after { content: "waiting for memory activity..."; display: block; padding: 8px 12px; color: #484f58; font-style: italic; }
#feed .ev { display: flex; gap: 6px; align-items: baseline; padding: 4px 12px; border-left: 3px solid var(--c); animation: feedin 0.3s ease-out; }
#feed .ev .t { color: #484f58; font-variant-numeric: tabular-nums; }
#feed .ev .k { text-transform: uppercase; font-size: 9px; letter-spacing: 0.5px; color: var(--c); flex-shrink: 0; }
#feed .ev .n { color: #c9d1d9; word-break: break-all; flex: 1; }
#feed .ev .tool { color: #484f58; }
#controls-path { font-size: 11px; color: #6e7681; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 50vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#p-paths { margin-bottom: 12px; }
#p-paths h4 { font-size: 11px; color: #484f58; margin-bottom: 4px; }
#p-paths .path { font-size: 11px; color: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; padding: 2px 0; }
#search { width: 200px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; font-size: 13px; }
#search::placeholder { color: #484f58; }
#search:focus { outline: none; border-color: #58a6ff; }
#results { position: fixed; top: 44px; right: 12px; z-index: 11; width: 320px; max-width: 40vw;
  background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 6px;
  backdrop-filter: blur(4px); overflow: hidden; font-size: 11px; display: none; }
#results.open { display: block; }
#results-head { display: flex; align-items: baseline; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #21262d; color: #8b949e; }
#results-head .count { margin-left: auto; color: #484f58; font-variant-numeric: tabular-nums; }
#results-list { max-height: 70vh; overflow-y: auto; }
#results-list:empty::after { content: "no matches"; display: block; padding: 8px 12px; color: #484f58; font-style: italic; }
#results-list .hit { display: flex; gap: 8px; align-items: baseline; padding: 5px 12px; border-bottom: 1px solid #21262d; cursor: pointer; }
#results-list .hit:hover { background: rgba(88,166,255,0.08); }
#results-list .hit .rank { color: #58a6ff; font-variant-numeric: tabular-nums; flex-shrink: 0; width: 1.4em; text-align: right; }
#results-list .hit .meta { flex: 1; min-width: 0; }
#results-list .hit .nm { color: #c9d1d9; word-break: break-all; }
#results-list .hit .sub { color: #484f58; }
#results-list .hit .snip { color: #8b949e; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node.search-hit circle:first-of-type { stroke: #58a6ff !important; stroke-width: 3; }
.search-ring { fill: none; stroke: #58a6ff; stroke-opacity: 0.9; pointer-events: none; }
.search-badge { fill: #58a6ff; font-size: 9px; font-weight: 700; pointer-events: none; }
</style>
</head>
<body>
<div id="controls">
  <select id="project"><option value="">All projects</option></select>
  <button id="refresh">Refresh</button>
  <label style="font-size:12px;color:#484f58"><input type="checkbox" id="auto" checked> Auto (2s)</label>
  <label style="font-size:12px;color:#484f58"><input type="checkbox" id="follow" checked> Follow activity</label>
  <input id="search" type="text" placeholder="Search memory...">
  <label style="font-size:12px;color:#484f58"><input type="checkbox" id="search-all"> all terms</label>
  <span id="controls-path"></span>
</div>
<div id="results">
  <div id="results-head"><span>search results</span><span class="count" id="results-count"></span></div>
  <div id="results-list"></div>
</div>
<div id="status"></div>
<div id="activity">
  <div id="activity-head">
    <span class="pulse"></span><span>live activity</span>
    <div class="tally" id="activity-tally"></div>
  </div>
  <div id="feed"></div>
</div>
<div id="legend">
  <h4>Entity type</h4>
  <div id="legend-types"></div>
  <div class="section">
    <h4>Status (border)</h4>
    <div id="legend-statuses"></div>
  </div>
  <div class="section">
    <h4>Activity</h4>
    <div id="legend-activity"></div>
  </div>
</div>
<div id="panel">
  <button id="panel-close">&times;</button>
  <h2 id="p-name"></h2>
  <h3 id="p-type"></h3>
  <div id="p-status"></div>
  <div id="p-created" style="font-size:11px;color:#484f58;margin-bottom:12px"></div>
  <div id="p-paths"></div>
  <div id="p-obs"></div>
</div>
<svg></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const TYPE_COLOURS = {
  project: "#58a6ff", feature: "#3fb950", task: "#d29922",
  "user-preferences": "#bc8cff", pattern: "#f778ba",
  knowledge: "#56d364"
};
const fallbackColour = "#8b949e";
const statusColours = {
  planned: "#484f58", "in-progress": "#d29922",
  blocked: "#f85149", resolved: "#3fb950", archived: "#484f58"
};
const KIND_COLOURS = { read: "#58a6ff", create: "#3fb950", update: "#d29922", delete: "#f85149" };

const svg = d3.select("svg");
const width = () => window.innerWidth;
const height = () => window.innerHeight;
const g = svg.append("g");
const linkLayer = g.append("g");
const labelLayer = g.append("g");
const nodeLayer = g.append("g");

let lastUserInteract = 0;
const FOLLOW_SCALE = 1.5, FOLLOW_COOLDOWN = 2500, ZOOM_MIN = 0.2, ZOOM_MAX = 4;
const zoom = d3.zoom().scaleExtent([ZOOM_MIN, ZOOM_MAX]).on("zoom", e => {
  g.attr("transform", e.transform);
  if (e.sourceEvent) lastUserInteract = Date.now();
});
svg.call(zoom);

let simulation = null, linkSel, nodeSel, labelSel, currentData = null, selectedNode = null, orphans = new Set();
let nodes = [], links = [], relCount = new Map();

const panel = document.getElementById("panel");
document.getElementById("panel-close").onclick = () => { panel.classList.remove("open"); selectedNode = null; updateSelection(); };

let pathsByProject = {};
async function loadProjectPaths() {
  try { pathsByProject = await (await fetch("/api/project-paths")).json(); }
  catch (e) { pathsByProject = {}; }
  updateControlsPath();
}

function updateControlsPath() {
  const project = document.getElementById("project").value;
  const paths = project ? (pathsByProject[project] || []) : [];
  document.getElementById("controls-path").textContent = paths.join("  -  ");
}

async function loadProjects() {
  const res = await fetch("/api/projects");
  const projects = await res.json();
  const sel = document.getElementById("project");
  sel.innerHTML = '<option value="">All projects</option>' + projects.map(p => `<option value="${p}">${p}</option>`).join("");
  loadProjectPaths();
  fetchGraph();
}

function buildLegend() {
  const types = document.getElementById("legend-types");
  for (const [name, colour] of Object.entries(TYPE_COLOURS)) {
    types.innerHTML += `<div class="row"><span class="dot" style="background:${colour}"></span>${name}</div>`;
  }
  types.innerHTML += `<div class="row"><span class="dot" style="background:${fallbackColour}"></span>other</div>`;
  const statuses = document.getElementById("legend-statuses");
  for (const [name, colour] of Object.entries(statusColours)) {
    statuses.innerHTML += `<div class="row"><span class="dot" style="border:2px solid ${colour};background:transparent"></span>${name}</div>`;
  }
  statuses.innerHTML += `<div class="row"><span class="dot" style="border:2px dashed #f85149;background:transparent"></span>orphan (no relations)</div>`;
  const acts = document.getElementById("legend-activity");
  for (const [name, colour] of Object.entries(KIND_COLOURS)) {
    acts.innerHTML += `<div class="row"><span class="dot" style="background:${colour};box-shadow:0 0 5px ${colour}"></span>${name}</div>`;
  }
}
buildLegend();

async function fetchGraph() {
  const project = document.getElementById("project").value;
  const url = project ? `/api/graph?project=${encodeURIComponent(project)}` : "/api/graph";
  try {
    const res = await fetch(url);
    const data = await res.json();
    document.getElementById("status").textContent = `${data.entities.length} nodes, ${data.relations.length} edges`;
    const connected = new Set();
    data.relations.forEach(r => { connected.add(r.source); connected.add(r.target); });
    const orphanCount = data.entities.filter(e => !connected.has(e.name) && e.entity_type !== "project").length;
    if (orphanCount) document.getElementById("status").textContent += `, ${orphanCount} orphan${orphanCount > 1 ? "s" : ""}`;
    if (JSON.stringify(data) !== JSON.stringify(currentData)) { currentData = data; render(data); }
  } catch (e) { document.getElementById("status").textContent = "error: " + e.message; }
}

const nodeRadius = d => 5 + Math.min((relCount.get(d.id) || 0) * 2, 25);

function render(data) {
  const incoming = data.entities.map(e => ({ id: e.name, ...e }));
  const nodeSet = new Set(incoming.map(n => n.id));
  const newLinks = data.relations.filter(r => nodeSet.has(r.source) && nodeSet.has(r.target))
    .map(r => ({ source: r.source, target: r.target, type: r.relation_type }));

  const connected = new Set();
  data.relations.forEach(r => { connected.add(r.source); connected.add(r.target); });
  orphans = new Set(incoming.filter(n => !connected.has(n.id) && n.entity_type !== "project").map(n => n.id));

  relCount = new Map(incoming.map(n => [n.id, 0]));
  data.relations.forEach(r => {
    if (relCount.has(r.source)) relCount.set(r.source, relCount.get(r.source) + 1);
    if (relCount.has(r.target)) relCount.set(r.target, relCount.get(r.target) + 1);
  });

  const oldNodeIds = new Set(nodes.map(n => n.id));
  const oldLinkKeys = new Set(links.map(d => (d.source.id || d.source) + "-" + (d.target.id || d.target) + "-" + d.type));
  const newLinkKeys = new Set(newLinks.map(d => d.source + "-" + d.target + "-" + d.type));
  const topologyChanged = incoming.length !== oldNodeIds.size
    || incoming.some(n => !oldNodeIds.has(n.id))
    || newLinkKeys.size !== oldLinkKeys.size
    || [...newLinkKeys].some(k => !oldLinkKeys.has(k));

  const oldMap = new Map(nodes.map(n => [n.id, n]));
  nodes = incoming.map(n => {
    const old = oldMap.get(n.id);
    if (old) { Object.assign(old, { name: n.name, entity_type: n.entity_type, status: n.status, observations: n.observations }); return old; }
    return n;
  });
  links = newLinks;

  linkSel = linkLayer.selectAll(".link").data(links, d => d.source.id || d.source + "-" + (d.target.id || d.target) + "-" + d.type)
    .join("line").attr("class", "link").attr("stroke", "#30363d").attr("stroke-width", 1);

  labelSel = labelLayer.selectAll(".link-label").data(links, d => d.source.id || d.source + "-" + (d.target.id || d.target) + "-" + d.type)
    .join("text").attr("class", "link-label").text(d => d.type);

  nodeSel = nodeLayer.selectAll(".node").data(nodes, d => d.id).join(
    enter => {
      const grp = enter.append("g");
      grp.append("circle");
      grp.append("text");
      return grp;
    },
    update => update,
    exit => exit.remove()
  );

  nodeSel
    .attr("class", d => "node" + (orphans.has(d.id) ? " orphan" : "") + (d.id === selectedNode ? " selected" : ""))
    .call(d3.drag().on("start", dragStart).on("drag", dragged).on("end", dragEnd))
    .on("click", (e, d) => { selectedNode = d.id; showPanel(d); updateSelection(); });

  nodeSel.select("circle")
    .attr("r", nodeRadius)
    .attr("fill", d => TYPE_COLOURS[d.entity_type] || fallbackColour)
    .attr("stroke", d => d.status ? statusColours[d.status] || "#30363d" : "#30363d");

  nodeSel.select("text").attr("dx", d => 3 + nodeRadius(d)).attr("dy", 4)
    .text(d => d.name.length > 40 ? d.name.slice(0, 37) + "..." : d.name);

  if (!simulation) {
    simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(80))
      .force("charge", d3.forceManyBody().strength(-120))
      .force("center", d3.forceCenter(width() / 2, height() / 2))
      .force("collision", d3.forceCollide().radius(d => 5 + nodeRadius(d)))
      .on("tick", ticked);
  } else if (topologyChanged) {
    simulation.nodes(nodes);
    simulation.force("link").links(links);
    simulation.force("collision").radius(d => 5 + nodeRadius(d));
    simulation.alpha(0.05).restart();
  }

  applySearchRings();  // nodeSel was just rebuilt; reapply persistent search rings
}

function ticked() {
  linkSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  labelSel.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
}

function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

function showPanel(d) {
  document.getElementById("p-name").textContent = d.name;
  document.getElementById("p-type").textContent = d.entity_type;
  const sb = document.getElementById("p-status");
  sb.innerHTML = d.status ? `<span class="status-badge" style="color:${statusColours[d.status] || '#c9d1d9'}">${d.status}</span>` : "";
  document.getElementById("p-created").textContent = d.created_at ? `Created: ${new Date(d.created_at + "Z").toLocaleString()}` + (d.updated_at && d.updated_at !== d.created_at ? ` | Updated: ${new Date(d.updated_at + "Z").toLocaleString()}` : "") : "";
  const paths = pathsByProject[d.project] || [];
  document.getElementById("p-paths").innerHTML = paths.length
    ? `<h4>On disk (${d.project})</h4>` + paths.map(p => `<div class="path">${p.replace(/</g,"&lt;")}</div>`).join("")
    : "";
  document.getElementById("p-obs").innerHTML = d.observations.map(o => `<div class="obs">${o.replace(/</g,"&lt;")}</div>`).join("");
  document.getElementById("results").classList.remove("open");
  panel.classList.add("open");
}

function updateSelection() {
  if (nodeSel) nodeSel.attr("class", d => "node" + (orphans.has(d.id) ? " orphan" : "") + (d.id === selectedNode ? " selected" : ""));
}

document.getElementById("project").onchange = () => { currentData = null; if (simulation) { simulation.stop(); simulation = null; } updateControlsPath(); fetchGraph(); runSearch(); };
document.getElementById("refresh").onclick = fetchGraph;

let timer = setInterval(fetchGraph, 2000);
document.getElementById("auto").onchange = function() {
  clearInterval(timer);
  if (this.checked) timer = setInterval(fetchGraph, 2000);
};

const tally = { read: 0, create: 0, update: 0, delete: 0 };
function renderTally() {
  document.getElementById("activity-tally").innerHTML = Object.entries(tally)
    .map(([k, n]) => `<span><i style="background:${KIND_COLOURS[k]}"></i>${n}</span>`).join("");
}
renderTally();

function eventMatchesNode(d, ev, name) {
  if (d.id !== name) return false;
  if (ev.project && d.project) return d.project === ev.project;
  return true;
}

function pulseNode(name, ev) {
  const colour = KIND_COLOURS[ev.kind] || fallbackColour;
  if (!nodeSel) return;
  nodeSel.filter(d => eventMatchesNode(d, ev, name)).each(function(d) {
    const grp = d3.select(this);
    grp.style("--glow", colour).classed("activity", false);
    this.getBoundingClientRect();
    grp.classed("activity", true);
    setTimeout(() => grp.classed("activity", false), 1500);
    grp.append("circle").attr("class", "ripple")
      .attr("r", nodeRadius(d)).attr("stroke", colour).attr("stroke-width", 2).attr("stroke-opacity", 0.7)
      .transition().duration(1500).ease(d3.easeCubicOut)
      .attr("r", nodeRadius(d) + 55).attr("stroke-opacity", 0).attr("stroke-width", 0.5)
      .remove();
  });
}

function focusOn(events) {
  if (!document.getElementById("follow").checked) return;
  if (Date.now() - lastUserInteract < FOLLOW_COOLDOWN) return;
  const hits = nodes.filter(d => Number.isFinite(d.x) && Number.isFinite(d.y)
    && events.some(ev => ev.entities.some(name => eventMatchesNode(d, ev, name))));
  if (!hits.length) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  hits.forEach(d => {
    const r = nodeRadius(d) + 30;
    minX = Math.min(minX, d.x - r); maxX = Math.max(maxX, d.x + r);
    minY = Math.min(minY, d.y - r); maxY = Math.max(maxY, d.y + r);
  });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const fit = Math.min(width() / Math.max(maxX - minX, 1), height() / Math.max(maxY - minY, 1));
  const k = Math.max(ZOOM_MIN, Math.min(FOLLOW_SCALE, fit));
  const t = d3.zoomIdentity.translate(width() / 2, height() / 2).scale(k).translate(-cx, -cy);
  svg.transition().duration(600).ease(d3.easeCubicOut).call(zoom.transform, t);
}

const feed = document.getElementById("feed");
function addToFeed(ev) {
  const colour = KIND_COLOURS[ev.kind] || fallbackColour;
  const time = new Date(ev.ts * 1000).toLocaleTimeString();
  const label = ev.entities.length ? ev.entities.join(", ") : (ev.project || "-");
  const row = document.createElement("div");
  row.className = "ev";
  row.style.setProperty("--c", colour);
  row.innerHTML = `<span class="t">${time}</span><span class="k">${ev.kind}</span>`
    + `<span class="n">${label.replace(/</g, "&lt;")} <span class="tool">${ev.tool}</span></span>`;
  feed.prepend(row);
  while (feed.childElementCount > 40) feed.lastElementChild.remove();
}

let lastSeq = 0;
async function fetchActivity() {
  try {
    const res = await fetch(`/api/activity?since=${lastSeq}`);
    const data = await res.json();
    if (data.seq === lastSeq) return;
    lastSeq = data.seq;
    for (const ev of data.events) {
      tally[ev.kind] = (tally[ev.kind] || 0) + 1;
      ev.entities.forEach(name => pulseNode(name, ev));
      addToFeed(ev);
    }
    focusOn(data.events);
    renderTally();
  } catch (e) { /* transient poll failure; retry next tick */ }
}

async function primeActivity() {
  try {
    const data = await (await fetch("/api/activity?since=0")).json();
    lastSeq = data.seq;
    for (const ev of data.events.slice(-40)) {  // replay recent history into the feed, newest on top
      tally[ev.kind] = (tally[ev.kind] || 0) + 1;
      addToFeed(ev);
    }
    renderTally();
  } catch (e) { /* leave lastSeq at 0; first poll will catch up */ }
  setInterval(fetchActivity, 800);
}
primeActivity();

let searchHits = [];
let searchRankByName = new Map();

function clearSearchRings() {
  if (nodeSel) nodeSel.classed("search-hit", false);
  nodeLayer.selectAll(".search-ring, .search-badge").remove();
}

function applySearchRings() {
  clearSearchRings();
  if (!nodeSel || !searchRankByName.size) return;
  nodeSel.filter(d => searchRankByName.has(d.id)).each(function(d) {
    const grp = d3.select(this), r = nodeRadius(d);
    grp.classed("search-hit", true);
    grp.append("circle").attr("class", "search-ring").attr("r", r + 6).attr("stroke-width", 1.5);
    grp.append("text").attr("class", "search-badge").attr("dx", -(r + 14)).attr("dy", -(r + 6))
      .text(searchRankByName.get(d.id));
  });
}

function renderResults(hits) {
  searchHits = hits;
  searchRankByName = new Map(hits.map(h => [h.name, h.rank]));
  document.getElementById("results-count").textContent = hits.length + (hits.length === 1 ? " match" : " matches");
  document.getElementById("results-list").innerHTML = hits.map(h => {
    const snip = (h.observations[0] || "").replace(/</g, "&lt;");
    const sub = [h.entity_type, h.project, h.status].filter(Boolean).join(" · ");
    return `<div class="hit" data-name="${h.name.replace(/"/g, "&quot;")}">`
      + `<span class="rank">${h.rank}</span>`
      + `<span class="meta"><span class="nm">${h.name.replace(/</g, "&lt;")}</span>`
      + `<span class="sub"> ${sub}</span><span class="snip">${snip}</span></span></div>`;
  }).join("");
  document.getElementById("results").classList.add("open");
  applySearchRings();
}

async function runSearch() {
  const q = document.getElementById("search").value.trim();
  if (!q) { document.getElementById("results").classList.remove("open"); searchRankByName = new Map(); clearSearchRings(); return; }
  const project = document.getElementById("project").value;
  const params = new URLSearchParams({ q });
  if (project) params.set("project", project);
  if (document.getElementById("search-all").checked) params.set("match_all", "true");
  try { renderResults((await (await fetch("/api/search?" + params)).json()).entities); }
  catch (e) { /* transient; keep previous results */ }
}

document.getElementById("search").onkeydown = (e) => { if (e.key === "Enter") runSearch(); };
document.getElementById("search-all").onchange = runSearch;
document.getElementById("results-list").onclick = (e) => {
  const row = e.target.closest(".hit");
  if (!row) return;
  const node = nodes.find(n => n.id === row.dataset.name);
  if (node) { selectedNode = node.id; showPanel(node); updateSelection(); }
  else { showPanel(searchHits.find(h => h.name === row.dataset.name)); }
  document.getElementById("results").classList.remove("open");
};

loadProjects();
</script>
